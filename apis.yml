aid: ivp
name: Institutional Venture Partners
description: >-
  Institutional Venture Partners (IVP) is a later-stage venture capital and
  growth equity firm founded in 1980 by Reid Dennis and headquartered in Menlo
  Park, California, with offices in San Francisco and London. One of the oldest
  venture firms in Silicon Valley, IVP concentrates on the fastest-growing,
  most prominent late-stage and growth-stage technology companies each year,
  typically writing checks in the $10M to $100M range and taking a long-term
  view toward value creation. The firm invests across enterprise software and
  SaaS, fintech, cybersecurity, developer tools and cloud infrastructure,
  data and AI, consumer internet, media, gaming, and healthcare. Across roughly
  45 years and 18 funds (Fund XVIII closed at $1.6B in 2024) IVP has backed
  more than 400 companies and seen 135+ IPOs, with roughly $7B–$8B in assets
  under management. Notable investments and exits include Netflix, Twitter,
  Snap, Coinbase, Dropbox, GitHub, Slack, Datadog, CrowdStrike, HashiCorp,
  UiPath, Robinhood, Klarna, Wise, Figma, Grammarly, Rubrik, Discord,
  Anthropic, Perplexity, and DeepL.
